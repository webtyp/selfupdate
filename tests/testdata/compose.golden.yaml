    depends_on:
      db: { condition: service_healthy }
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      PORT: "8443"
      INTERNET_PORT: "8444"
      APP_DOMAIN: app.example.com
      DATABASE_URL_FILE: /run/secrets/database_url
      CLOUDFLARE_DNS_API_TOKEN_FILE: /run/secrets/dns_token
